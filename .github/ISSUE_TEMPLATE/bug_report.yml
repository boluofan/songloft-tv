name: "🐛 Bug 反馈"
description: "报告一个问题或异常行为"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请尽量填写完整信息，方便快速定位。
        提交前请先搜索已有 Issues，避免重复。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前排查
      description: 请先完成以下排查，有助于缩小问题范围
      options:
        - label: 我已搜索过已有 Issues，没有找到相同问题
          required: true
        - label: （歌曲播放类问题）我已在 Web 端或移动端播放过同一首歌曲，确认歌曲本身可正常播放，排除歌曲文件问题
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简要地描述遇到的问题
      placeholder: 例如：播放电台时应用崩溃退出
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 描述如何复现该问题
      placeholder: |
        1. 打开首页
        2. 进入「电台」页面
        3. 选择任意电台播放
        4. 应用崩溃
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望正常情况下应该发生什么
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 可在「设置 - 关于」中查看
      placeholder: 例如 v1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号与 Android 版本
      placeholder: 例如 小米电视 ES55 / Android 11
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Songloft 服务端版本
      placeholder: 例如 v0.5.2
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 崩溃信息
      description: |
        导出应用日志的方法：TV 端进入「我的 - 设置 - 导出日志」导出日志，然后用手机扫码进入管理界面，在「日志」页签下载导出的日志文件。
        请将日志内容粘贴在此（会自动格式化为代码块），或以附件形式上传。
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如有截图/录屏可直接拖拽上传
    validations:
      required: false
